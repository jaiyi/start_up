# 示例文件：不要直接放生产密码。
# 服务器部署建议复制到 /opt/family-nutrition-state/docker-compose.yml 后再按实际环境调整。
# 本示例只启动独立 Postgres；MCP 服务连接数据库属于 Milestone 2。

services:
  family-nutrition-postgres:
    image: postgres:16
    container_name: family-nutrition-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${FAMILY_NUTRITION_POSTGRES_DB}
      POSTGRES_USER: ${FAMILY_NUTRITION_POSTGRES_OWNER_USER}
      POSTGRES_PASSWORD: ${FAMILY_NUTRITION_POSTGRES_OWNER_PASSWORD}
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
      - ./backups:/backups
      - ./state/migrations:/migrations:ro
      - ./state/seeds:/seeds:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - family-nutrition-state
    # 默认不暴露公网端口。
    # 如只在服务器本机调试，可临时打开下一行：
    # ports:
    #   - "127.0.0.1:5432:5432"

networks:
  family-nutrition-state:
    driver: bridge
