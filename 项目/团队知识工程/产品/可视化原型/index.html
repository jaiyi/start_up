<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>团队知识工程 · 共创产品概念稿</title>
<style>
  :root { font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif; color:#192b2a; background:#f2f5f1; --green:#176859; --ink:#192b2a; --muted:#647670; --line:#dce6df; --warn:#80561e; --red:#9c443a; }
